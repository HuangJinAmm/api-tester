[package]
name = "httptest"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Markdown-driven HTTP test CLI"

[dependencies]
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", features = [
    "json",
    "multipart",
    "cookies",
    "stream",
    "gzip",
    "brotli",
    "deflate",
    "rustls-tls"
] }
tokio = { version = "1", features = ["full"] }
pulldown-cmark = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
handlebars = "5"
csv = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
anyhow = "1"
thiserror = "1"
rhai = "1"
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
futures = "0.3"
once_cell = "1"
walkdir = "2"
url = "2"

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"
